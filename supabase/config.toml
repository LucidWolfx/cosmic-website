project_id = "cosmic-website"

# Discord's Ed25519 signature is checked by the interaction handler.
[functions.discord-interactions]
verify_jwt = false

# The queue endpoint requires a separate secret Authorization bearer token.
[functions.discord-delivery]
verify_jwt = false

# The handler validates the caller with Supabase Auth and checks live Discord roles.
[functions.department-hub]
verify_jwt = false

# Public image proxy for a fixed, owner-approved staff identity. No profile data.
[functions.staff-avatar]
verify_jwt = false

# Public, minimal directory of current members holding fixed Cosmic staff roles.
[functions.staff-directory]
verify_jwt = false
